[project]
name = "pdfcraft"
version = "0.1.0"
description = "PDF and Markdown conversion toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown>=3.5",
    "weasyprint>=61.0",
    "Pygments>=2.17",
    "pdfplumber>=0.11.7",
    "PyMuPDF>=1.26.4",
    "pytesseract>=0.3.13",
    "Pillow>=11.1.0",
    "openai>=1.107.2",
]

[project.scripts]
pdfcraft = "pdfcraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfcraft"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]
